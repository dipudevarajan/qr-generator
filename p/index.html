<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Page</title>
<meta name="description" content="">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;padding:2rem 1rem}
.card{background:#fff;border-radius:22px;padding:2.25rem 1.75rem;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.1)}
.brand-logo{width:76px;height:76px;border-radius:18px;object-fit:contain;margin:0 auto 1rem;display:block;border:1px solid #eee;background:#fff}
.brand-letter{width:76px;height:76px;border-radius:18px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff}
h1{font-size:22px;font-weight:700;color:#111;margin-bottom:4px}
.tag{font-size:14px;color:#888;margin-bottom:2rem}
.links{display:flex;flex-direction:column;gap:10px}
a.link-btn{display:flex;align-items:center;justify-content:center;padding:14px 18px;border-radius:12px;border:2px solid currentColor;font-size:15px;font-weight:600;text-decoration:none;background:#fafafa;transition:all .18s}
a.link-btn:hover{transform:translateY(-1px);filter:brightness(0.95)}
.footer{margin-top:2rem;font-size:11px;color:#bbb}
.footer a{color:#888;text-decoration:none}
.error{color:#c33;font-size:14px;padding:1rem;background:#fee;border-radius:8px}
</style>
</head>
<body>
<div class="card" id="card">
  <p>Loading…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script>
function decode(hashStr) {
  if (!hashStr || !hashStr.startsWith('#d=')) return null;
  const compressed = hashStr.slice(3);
  try {
    const json = LZString.decompressFromEncodedURIComponent(compressed);
    return JSON.parse(json);
  } catch(e) {
    return null;
  }
}

function escapeHTML(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(data) {
  const name = escapeHTML(data.n || 'Link Page');
  const tag = escapeHTML(data.t || '');
  const accent = (data.a || '#6c63ff').replace(/[^#0-9a-fA-F]/g,'').slice(0,7);
  const links = (data.l || []).filter(x => x && x.u);
  const logo = data.i || '';

  document.title = name + (tag ? ' — ' + tag : '');
  document.querySelector('meta[name=description]').content = tag || name;

  let logoHTML = '';
  if (logo && /^https?:\/\//.test(logo)) {
    logoHTML = `<img src="${escapeHTML(logo)}" class="brand-logo" alt="${name}" onerror="this.style.display='none'">`;
  } else if (logo && logo.startsWith('data:image/')) {
    logoHTML = `<img src="${logo}" class="brand-logo" alt="${name}">`;
  } else {
    const letter = (name[0] || 'A').toUpperCase();
    logoHTML = `<div class="brand-letter" style="background:${accent}">${letter}</div>`;
  }

  const linksHTML = links.map(l => {
    const url = escapeHTML(l.u);
    const label = escapeHTML(l.b || l.u);
    return `<a class="link-btn" href="${url}" target="_blank" rel="noopener" style="color:${accent};border-color:${accent}33">${label}</a>`;
  }).join('');

  document.getElementById('card').innerHTML = `
    ${logoHTML}
    <h1>${name}</h1>
    ${tag ? `<p class="tag">${tag}</p>` : ''}
    <div class="links">${linksHTML || '<p style="color:#999;font-size:13px">No links yet.</p>'}</div>
    <p class="footer">Made with <a href="/" target="_blank">adfreeqr.com</a></p>
  `;
}

const data = decode(location.hash);
if (data) {
  render(data);
} else {
  document.getElementById('card').innerHTML = `
    <div class="error">
      <strong>Invalid link page</strong><br>
      This page cannot be displayed. The link may be corrupted or incomplete.
    </div>
    <p class="footer"><a href="/">Create your own at adfreeqr.com</a></p>
  `;
}
</script>
</body>
</html>
